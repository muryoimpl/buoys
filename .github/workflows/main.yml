name: CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false

      matrix:
        ruby: [3.3.12, 3.4.10, 4.0.6]
        gemfile: [Gemfile-rails8.1.x, Gemfile-rails8.0.x]

    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: gemfiles/${{ matrix.gemfile }}

    steps:
    - uses: actions/checkout@v4
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true

    - name: Setup database
      env:
        RAILS_ENV: test
        BUNDLE_GEMFILE: ../../gemfiles/${{ matrix.gemfile }}
      run: |
        cd test/dummy/
        bin/rake db:test:prepare

    - name: Run minitest
      env:
        RAILS_ENV: test
        BUNDLE_GEMFILE: gemfiles/${{ matrix.gemfile }}
      run: |
        bin/test

    - name: Run Rubocop
      run: |
        bundle exec rubocop .
